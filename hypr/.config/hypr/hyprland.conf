# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = SUPER, T, exec, qs ipc call theme toggle
bind = SUPER, D, exec, qs ipc call launcher toggle
bind = SUPER, W, exec, qs ipc call wallpaper toggle
bind = SUPER, N, exec, qs ipc call controlCenter toggle

bind = SUPER ALT, S, exec, hyprshot -m region


# ── PER-MACHINE: edit these for your displays ─────────────────────────
# `hyprctl monitors` will list available outputs and their modes.
# Lines below are the author's setup (DP-1 + DP-2). DELETE OR REPLACE
# on a new machine before reloading Hyprland.
# monitor = NAME, RESOLUTION@REFRESH, POSITION, SCALE[, transfrom, N]
monitor = DP-1,2560x1440@144,1080x0,1
monitor = DP-2,1920x1080@50,0x0,1,transform,3
# ──────────────────────────────────────────────────────────────────────

#Move focus (just shifts which window is active)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Move window — within current monitor, crosses to next monitor at the edge
bind = SUPER SHIFT, left,  movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up,    movewindow, u
bind = SUPER SHIFT, down,  movewindow, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

#exec on startup
exec-once = quickshell

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# Volume (works even when locked)
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle

# Decorations
decoration {
	rounding = 15

	active_opacity = 1.0
	inactive_opacity = 0.95

	blur {
		enabled = true
		size = 8
		passes = 2
	}

	shadow {
		enabled = true
		range = 20
		render_power = 3
		color = rgba(1a1a1aee)
	}
}
hl.window_rule({ match = { class = "kitty" },        opacity = "0.8 0.8" })
hl.window_rule({ match = { float = true },           opacity = "0.5 0.5" })
